<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Python Viva Q&A</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f5f7fb;color:#182033}header{background:#1f4b8f;color:#fff;padding:28px 16px;text-align:center}h1{font-size:28px;margin:0 0 8px}header p{margin:0}.wrap{max-width:720px;margin:auto;padding:12px}.tools{position:sticky;top:0;background:#f5f7fb;padding:8px 0;z-index:2}input{width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:12px;font-size:16px;box-sizing:border-box;margin-bottom:8px}.buttons{display:flex;gap:8px}button{font:inherit}.btn{flex:1;border:0;border-radius:10px;padding:11px;background:#1f4b8f;color:#fff;font-weight:600}section{background:#fff;border-radius:14px;margin:14px 0;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.07)}h2{font-size:18px;margin:0;background:#eaf1fb;color:#1f4b8f;padding:14px}.qa{border-top:1px solid #edf0f4}.q{width:100%;text-align:left;border:0;background:#fff;padding:16px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:16px}.q:active{background:#f7f9fc}.a{display:none;padding:0 16px 17px;color:#46536a;font-size:16px;line-height:1.55}.a.show{display:block}.plus{color:#1f4b8f;font-size:21px}.hide{display:none!important}footer{text-align:center;color:#6b7280;padding:25px 10px;font-size:13px}</style></head><body><header><h1>Python Viva Q&A</h1><p>Introduction to Python through Lambda Functions</p></header><main class="wrap"><div class="tools"><input id="search" placeholder="Search questions..." oninput="search()"><div class="buttons"><button class="btn" onclick="allAns(true)">Open All</button><button class="btn" onclick="allAns(false)">Close All</button></div></div><div id="content"></div></main><footer>Tap any question to view its answer.</footer><script>const sections=[['1. Introduction to Python',[['What is Python?','Python is a general-purpose programming language often used for scripting and application programming.'],['Is Python open source?','Yes. Python is open source and freely available.'],['Why is Python popular?','It is simple, readable, accessible, and has many libraries.'],['What type of language is Python?','Python is an interpreted, high-level programming language.'],['Does Python use indentation?','Yes. Indentation is used to define blocks of code.'],['What is Jupyter Notebook?','It is a web-based interactive environment used to write and run code, with text, visualizations, and explanations.']]],['2. Variables, Keywords and Data Types',[['What is a variable in Python?','A variable is a name that refers to a value/object.'],['Does Python require variable type declaration?','No. Python determines the type from the value assigned to the variable.'],['What is dynamic typing?','It means a variable can refer to objects of different types during program execution.'],['What are Python keywords?','Keywords are reserved words with special meaning in Python and cannot normally be used as variable names.'],['Give examples of Python keywords.','Examples include if, else, for, while, def, return, lambda, True, False, and None.'],['What is type casting?','Type casting converts a value from one data type to another, such as string to integer.']]],['3. Strings and Boolean Values',[['What is a string?','A string is a sequence of characters enclosed in quotes.'],['How can strings be created?','They can be written using single quotes, double quotes, or triple quotes.'],['Are strings mutable?','No. Strings are immutable.'],['What does split() do?','It splits a string into a list using a separator.'],['What does upper() do?','It converts alphabetic characters to uppercase.'],['What does lower() do?','It converts alphabetic characters to lowercase.'],['What is a Boolean value?','A Boolean value is either True or False.'],['What is None?','None represents the absence of a value.']]],['4. Lists',[['What is a list?','A list is an ordered, mutable collection that can contain multiple values.'],['Are lists mutable?','Yes. List elements can be changed after creation.'],['What does append() do?','It adds an element to the end of a list.'],['What does insert() do?','It adds an element at a specified position.'],['What does remove() do?','It removes a specified element from a list.'],['What does pop() do?','It removes and returns an element, normally the last element if no index is given.']]],['5. Tuples',[['What is a tuple?','A tuple is an ordered collection of values that is immutable.'],['How is a tuple written?','Usually with parentheses, such as (1, 2, 3).'],['Can a tuple contain different data types?','Yes.'],['Can a tuple be changed after creation?','No. Tuples are immutable.'],['What is tuple unpacking?','It assigns the elements of a tuple to multiple variables.']]],['6. Sets',[['What is a set?','A set is a mutable, unordered collection of unique items.'],['Can a set contain duplicate values?','No. Duplicate values are removed.'],['What is set union?','Union combines elements from two sets.'],['What is set intersection?','Intersection gives elements common to both sets.'],['What is set difference?','Difference gives elements present in one set but not the other.']]],['7. Dictionaries',[['What is a dictionary?','A dictionary is an unordered collection of key-value pairs.'],['How is a dictionary written?','It is written using curly braces with key:value pairs.'],['How do you access a dictionary value?','Use its key, for example d[\'key\'].'],['What does keys() return?','It provides the dictionary keys.'],['What does values() return?','It provides the dictionary values.'],['What does items() return?','It provides key-value pairs.']]],['8. Operators',[['What are arithmetic operators?','They perform arithmetic operations such as +, -, *, /, //, %, and **.'],['What does // mean?','It is the floor division operator.'],['What does % mean?','It is the modulus operator and gives the remainder.'],['What does ** mean?','It is the exponentiation operator.'],['What are logical operators?','and, or, and not are logical operators.'],['What does the in operator do?','It checks whether a value is present in a sequence or collection.']]],['9. Control Statements',[['What is an if statement?','It executes a block when a condition is true.'],['What is an if-else statement?','It chooses between two blocks based on a condition.'],['What is a for loop?','It repeats a block for each item in an iterable.'],['What is a while loop?','It repeats a block while a condition remains true.'],['What does range() do?','It generates a sequence of numbers, commonly used with loops.'],['What does break do?','It terminates the loop.'],['What does continue do?','It skips the current iteration and continues with the next iteration.'],['What does pass do?','It does nothing and is used as a placeholder.']]],['10. Files',[['What is file handling?','It is the process of opening, reading, writing, and closing files.'],['How do you open a file?','Use the open() function with a file name and mode.'],['What is the default file mode?','The default mode is r, for reading.'],['What does w mode mean?','It opens a file for writing and can overwrite existing content.'],['What does a mode mean?','It opens a file for appending content.'],['What does r+ mean?','It opens a file for reading and writing.']]],['11. Functions',[['What is a function?','A function is a reusable block of code that performs a task.'],['How do you define a function?','Use the def keyword followed by the function name and parameters.'],['What is a parameter?','A parameter is a variable listed in a function definition.'],['What is an argument?','An argument is a value passed to a function when it is called.'],['What does return do?','It sends a value back to the caller and ends the function execution.'],['What is a default argument?','It is a parameter that already has a default value.'],['What is a docstring?','A docstring is a string used to document the purpose and usage of a function or object.']]],['12. Function Arguments',[['What are positional arguments?','Arguments matched to parameters according to their position.'],['What are keyword arguments?','Arguments passed using the parameter name, such as name=\'Riya\'.'],['What is *args?','*args collects additional positional arguments into a tuple.'],['What is **kwargs?','**kwargs collects additional keyword arguments into a dictionary.']]],['13. Lambda Functions',[['What is a lambda function?','A lambda function is a small anonymous function.'],['Does a lambda function have a name?','Normally, no. It is an anonymous function.'],['What is the syntax of a lambda function?','lambda arguments : expression'],['How many expressions can a lambda function contain?','It contains a single expression.'],['Can a lambda function have multiple arguments?','Yes. It can take multiple arguments but has one expression.'],['Why are lambda functions used?','They provide a short way to write small functions, especially when a function is needed temporarily.'],['Give an example of a lambda function.','lambda x: x + 10'],['What does lambda x: x + 10 do?','It takes x as input and returns x + 10.'],['Can a lambda function take two arguments?','Yes. For example, lambda x, y: x + y.'],['What is the main difference between def and lambda?','def is used to define regular named functions, while lambda provides a short anonymous function with one expression.']]]];let n=1;const c=document.getElementById('content');sections.forEach(s=>{let sec=document.createElement('section');sec.innerHTML='<h2>'+s[0]+'</h2>';s[1].forEach(x=>{let qa=document.createElement('div');qa.className='qa';qa.innerHTML='<button class="q"><span>Q'+(n++)+'. '+x[0]+'</span><span class="plus">+</span></button><div class="a"><b>Ans:</b> '+x[1]+'</div>';qa.querySelector('.q').onclick=()=>{let a=qa.querySelector('.a');a.classList.toggle('show');qa.querySelector('.plus').textContent=a.classList.contains('show')?'−':'+'};sec.appendChild(qa)});c.appendChild(sec)});function allAns(open){document.querySelectorAll('.a').forEach(a=>a.classList.toggle('show',open));document.querySelectorAll('.plus').forEach(p=>p.textContent=open?'−':'+')}function search(){let t=document.getElementById('search').value.toLowerCase().trim();document.querySelectorAll('.qa').forEach(q=>q.classList.toggle('hide',t&&!q.textContent.toLowerCase().includes(t)));document.querySelectorAll('section').forEach(s=>s.classList.toggle('hide',[...s.querySelectorAll('.qa')].every(q=>q.classList.contains('hide'))))}</script></body></html>
